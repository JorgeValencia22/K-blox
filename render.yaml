# Configuración para desplegar KestWorlds en Render (plan gratuito).
# En Render: New > Blueprint > elige este repositorio.
services:
  - type: web
    name: kest-worlds
    runtime: node
    plan: free
    # --include=dev: Vite y Three.js se necesitan para compilar el cliente
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/catalog
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_USERNAMES
        sync: false
      # Cuenta del dueño con modo desarrollador: escribe los valores en el panel de Render
      - key: OWNER_USERNAME
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Copia continua de los datos en Turso (gratis): las cuentas no se pierden al reiniciar
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Guardado cifrado de todos los datos en un repositorio privado de GitHub (gratis)
      - key: GITHUB_DATA_REPO
        sync: false
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: KEST_DATA_KEY
        sync: false
